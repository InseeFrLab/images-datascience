name: Build and push Docker images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'

# The GITHUB_TOKEN only needs to read the repository
permissions:
  contents: read

jobs:
  base:
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: base
      context: base
      base_image: ubuntu:24.04
    secrets: inherit
  python-minimal:
    needs: [base]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: python-minimal
      context: python-minimal
      base_image: base
      languages: python
    secrets: inherit
  python-datascience:
    needs: [python-minimal]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: python-datascience
      context: python-datascience
      base_image: python-minimal
      languages: python
    secrets: inherit
  r-minimal:
    needs: [base]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: r-minimal
      context: r-minimal
      base_image: base
      languages: r
    secrets: inherit
  r-datascience:
    needs: [r-minimal]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: r-datascience
      context: r-datascience
      base_image: r-minimal
      languages: r
    secrets: inherit
  jupyter-python:
    needs: [python-datascience]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: jupyter-python
      context: jupyter
      base_image: python-datascience
      languages: python
    secrets: inherit
  vscode-python:
    needs: [python-datascience]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: vscode-python
      context: vscode
      base_image: python-datascience
      languages: python
    secrets: inherit
  pyspark:
    needs: [python-minimal]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: pyspark
      context: spark
      base_image: python-minimal
      languages: python
      spark: true
      build_gpu: false
    secrets: inherit
  jupyter-pyspark:
    needs: [pyspark]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: jupyter-pyspark
      context: jupyter
      base_image: pyspark
      languages: python
      spark: true
      build_gpu: false
    secrets: inherit
  vscode-pyspark:
    needs: [pyspark]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: vscode-pyspark
      context: vscode
      base_image: pyspark
      languages: python
      spark: true
      build_gpu: false
    secrets: inherit
  python-pytorch:
    needs: [python-minimal]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: python-pytorch
      context: python-pytorch
      base_image: python-minimal
      languages: python
    secrets: inherit
  jupyter-pytorch:
    needs: [python-pytorch]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: jupyter-pytorch
      context: jupyter
      base_image: python-pytorch
      languages: python
    secrets: inherit
  vscode-pytorch:
    needs: [python-pytorch]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: vscode-pytorch
      context: vscode
      base_image: python-pytorch
      languages: python
    secrets: inherit
  rstudio:
    needs: [r-datascience]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: rstudio
      context: rstudio
      base_image: r-datascience
      languages: r
    secrets: inherit
  sparkr:
    needs: [r-minimal]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: sparkr
      context: spark
      base_image: r-minimal
      languages: r
      spark: true
      build_gpu: false
    secrets: inherit
  rstudio-sparkr:
    needs: [sparkr]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: rstudio-sparkr
      context: rstudio
      base_image: sparkr
      languages: r
      spark: true
      build_gpu: false
    secrets: inherit
  r-python-julia:
    needs: [r-datascience]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: r-python-julia
      context: r-python-julia
      base_image: r-datascience
      languages: r-python
      build_gpu: false
    secrets: inherit
  vscode-r-python-julia:
    needs: [r-python-julia]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: vscode-r-python-julia
      context: vscode
      base_image: r-python-julia
      languages: r-python
      build_gpu: false
    secrets: inherit
  jupyter-r-python-julia:
    needs: [r-python-julia]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: jupyter-r-python-julia
      context: jupyter
      base_image: r-python-julia
      languages: r-python
      build_gpu: false
    secrets: inherit
  rstudio-r-python-julia:
    needs: [r-python-julia]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: rstudio-r-python-julia
      context: rstudio
      base_image: r-python-julia
      languages: r-python
      build_gpu: false
    secrets: inherit
  marimo-python:
    needs: [python-datascience]
    uses: ./.github/workflows/main-workflow-template.yml
    with:
      image: marimo-python
      context: marimo
      base_image: python-datascience
      languages: python
    secrets: inherit
