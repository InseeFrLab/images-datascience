schemaVersion: "2.0.0"
metadataTest:
  user: 1000
  workdir: "/home/onyxia/work"
fileExistenceTests:
  - name: "user home"
    path: "/home/onyxia"
    shouldExist: true
    permissions: "drwxr-x---"
    uid: 1000
    gid: 100
  - name: "onyxia init script"
    path: "/opt/onyxia-init.sh"
    shouldExist: true
    permissions: "-rwxr-xr-x"
    uid: 1000
    gid: 100
commandTests:
  - name: "Does the binary exists?"
    command: "which"
    args: ["helm"]
    expectedOutput: ["/usr/local/bin/helm"]
  - name: "Does the binary exists?"
    command: "which"
    args: ["kubectl"]
    expectedOutput: ["/usr/local/bin/kubectl"]
  - name: "Does the binary exists?"
    command: "which"
    args: ["R"]
    expectedOutput: ["/usr/local/bin/R"]
  - name: "Does the binary exists?"
    command: "which"
    args: ["quarto"]
    expectedOutput: ["/usr/local/bin/quarto"]
  - name: "Does the binary exists?"
    command: "which"
    args: ["java"]
    expectedOutput: ["/usr/lib/jvm/java-21-openjdk-amd64/bin/java"]
  - name: "Does the binary exists?"
    command: "which"
    args: ["duckdb"]
    expectedOutput: ["/usr/local/bin/duckdb"]
  - name: "R packages load"
    command: "Rscript"
    args: ["-e", "for (p in c('arrow', 'aws.s3', 'DBI', 'duckdb', 'paws', 'quarto', 'RPostgres', 'RPostgreSQL', 'sf', 'tidyverse')) library(p, character.only = TRUE)"]
  - name: "DuckDB R extensions are preinstalled for the user"
    command: "Rscript"
    args: ["-e", "con <- DBI::dbConnect(duckdb::duckdb()); DBI::dbExecute(con, 'SET autoinstall_known_extensions = false'); for (ext in c('httpfs', 'aws', 'postgres', 'spatial', 'icu')) DBI::dbExecute(con, paste('LOAD', ext))"]
  - name: "Java runs"
    command: "java"
    args: ["-version"]
  - name: "Workspace is empty (no leftover install files)"
    command: "ls"
    args: ["-A", "/home/onyxia/work"]
    excludedOutput: ["."]
