schemaVersion: "2.0.0"
metadataTest:
  user: 1000
  workdir: "/home/onyxia/work"
fileExistenceTests:
  - name: "user home"
    path: "/home/onyxia"
    shouldExist: true
    permissions: "drwxr-x---"
    uid: 1000
    gid: 100
  - name: "onyxia init script"
    path: "/opt/onyxia-init.sh"
    shouldExist: true
    permissions: "-rwxr-xr-x"
    uid: 1000
    gid: 100
commandTests:
  - name: "Does the binary exists?"
    command: "which"
    args: ["helm"]
    expectedOutput: ["/usr/local/bin/helm"]
  - name: "Does the binary exists?"
    command: "which"
    args: ["kubectl"]
    expectedOutput: ["/usr/local/bin/kubectl"]
  - name: "Does the binary exists?"
    command: "which"
    args: ["quarto"]
    expectedOutput: ["/usr/local/bin/quarto"]
  - name: "Does the binary exists?"
    command: "which"
    args: ["duckdb"]
    expectedOutput: ["/usr/local/bin/duckdb"]
  - name: "CLI tools run"
    command: "bash"
    args: ["-c", "aws --version && kubectl version --client && helm version && git --version && psql --version && jq --version"]
  - name: "DuckDB CLI extensions are preinstalled for the user"
    command: "duckdb"
    args: ["-c", "SET autoinstall_known_extensions = false; LOAD httpfs; LOAD aws; LOAD postgres; LOAD spatial; LOAD icu;"]
  - name: "Quarto can render PDFs with TinyTeX"
    command: "bash"
    args: ["-c", "quarto --version && pdflatex --version"]
  - name: "Locale is set"
    command: "bash"
    args: ["-c", "locale"]
    expectedError: ["^$"]
  - name: "Workspace is empty (no leftover install files)"
    command: "ls"
    args: ["-A", "/home/onyxia/work"]
    excludedOutput: ["."]
