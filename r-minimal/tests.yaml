schemaVersion: "2.0.0"
metadataTest:
  user: 1000
  workdir: "/home/onyxia/work"
fileExistenceTests:
  - name: "user home"
    path: "/home/onyxia"
    shouldExist: true
    permissions: "drwxr-x---"
    uid: 1000
    gid: 100
  - name: "onyxia init script"
    path: "/opt/onyxia-init.sh"
    shouldExist: true
    permissions: "-rwxr-xr-x"
    uid: 1000
    gid: 100
commandTests:
  - name: "Does the binary exists?"
    command: "which"
    args: ["helm"]
    expectedOutput: ["/usr/local/bin/helm"]
  - name: "Does the binary exists?"
    command: "which"
    args: ["kubectl"]
    expectedOutput: ["/usr/local/bin/kubectl"]
  - name: "Does the binary exists?"
    command: "which"
    args: ["R"]
    expectedOutput: ["/usr/local/bin/R"]
  - name: "Does the binary exists?"
    command: "which"
    args: ["duckdb"]
    expectedOutput: ["/usr/local/bin/duckdb"]
  - name: "R is the requested version"
    command: "bash"
    args: ["-c", "R --version | grep -F \"R version ${R_VERSION}\""]
  - name: "Workspace is empty (no leftover install files)"
    command: "ls"
    args: ["-A", "/home/onyxia/work"]
    excludedOutput: ["."]
